name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Set up Python
              if: ${{ hashFiles('requirements.txt') != '' }}
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Python dependencies
              if: ${{ hashFiles('requirements.txt') != '' }}
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Set up Node.js
              if: ${{ hashFiles('package.json') != '' }}
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install JavaScript dependencies from lockfile
              if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' }}
              run: npm ci

            - name: Install JavaScript dependencies without lockfile
              if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json', 'npm-shrinkwrap.json') == '' }}
              run: npm install
